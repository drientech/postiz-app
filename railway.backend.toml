# Railway config for the Postiz backend (NestJS API) service.
# Point this Railway service's "Config-as-Code Path" at railway.backend.toml.

[phases.setup]
    nixPkgs = ['nodejs', 'python3']
    aptPkgs = ['build-essential', 'libudev-dev']

[phases.build]
    cmds = ['pnpm run build:backend']

[deploy]
    startCommand = "pnpm run start:prod:backend"
